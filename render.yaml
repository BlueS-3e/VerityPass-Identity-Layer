services:
  - type: web
    name: realmint-api
    runtime: python
    pythonVersion: 3.11
    rootDir: api
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python migrate_projects_db.py
    startCommand: gunicorn --workers 1 --worker-class sync --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        scope: project
        sync: false
      - key: RPC_URL
        scope: project
        sync: false
      - key: MAINNET_RPC_URL
        scope: project
        sync: false
      - key: PRICE_FEED_ADDRESS
        value: "0x5f4eC3Df9cbd43714FE2740f5E3616155c5b8419"
      - key: LAUNCHPAD_ADDRESS
        scope: project
        sync: false
      - key: REDIS_URL
        scope: project
        sync: false
      - key: PLAID_CLIENT_ID
        scope: project
        sync: false
      - key: PLAID_SECRET
        scope: project
        sync: false
      - key: PLAID_ENVIRONMENT
        value: production
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
      - key: SESSION_LIFETIME_SECONDS
        value: "604800"
      - key: CORS_ORIGINS
        scope: project
        sync: false
      - key: PUBLIC_API_BASE
        scope: project
        sync: false
      - key: SENTRY_DSN
        scope: project
        sync: false
      - key: PROMETHEUS_MULTIPROC_DIR
        value: /tmp
      - key: LOG_LEVEL
        value: INFO
    healthCheckPath: /health
    preDeployCommand: python migrate_projects_db.py

databases:
  - name: realmint-postgres
    databaseName: realmint_prod
    user: realmint_user
    plan: starter
  - name: realmint-redis
    plan: starter
