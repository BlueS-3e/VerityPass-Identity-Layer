name: CI/CD - Deploy to Production

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
    branches:
      - main

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4.1.7
      
      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'  # LTS version (not deprecated Node.js 20)
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run Hardhat tests
        env:
          HARDHAT_NETWORK: hardhat
        run: npm test

  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veritypass_test  # ✅ Added
          POSTGRES_USER: postgres      # ✅ Added
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4.1.7
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'  # ✅ Added
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found"
            exit 1
          fi
      
      - name: Setup database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veritypass_test
        run: |
          sleep 5
          if [ -f migrate_projects_db.py ]; then
            python migrate_projects_db.py
          fi
      
      - name: Run pytest
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/veritypass_test
          REDIS_URL: redis://localhost:6379
          FLASK_ENV: testing
          SECRET_KEY: test-secret-key-do-not-use
        run: pytest tests/ -v

  test-webapp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4.1.7
      
      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'  # LTS version (not deprecated Node.js 20)
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Run tests
        run: |
          if npm run | grep -q " test$"; then
            npm test
          else
            echo "No test script found, skipping"
          fi
      
      - name: Build
        env:
          VITE_API_BASE: https://api.example.com
          VITE_NETWORK: mainnet
          VITE_CHAIN_ID: "1"
        run: npm run build

  test-webapp-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp-admin
    steps:
      - uses: actions/checkout@v4.1.7
      
      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '22'  # LTS version (not deprecated Node.js 20)
          cache: 'npm'
          cache-dependency-path: webapp-admin/package-lock.json
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build
        env:
          VITE_API_BASE: https://api.example.com
          VITE_NETWORK: mainnet
          VITE_CHAIN_ID: "1"
        run: npm run build

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # ✅ Added
      contents: read
    steps:
      - uses: actions/checkout@v4.1.7
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-notification:
    runs-on: ubuntu-latest
    needs: [test-contracts, test-api, test-webapp, test-webapp-admin]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
    steps:
      - name: Notify Slack on success
        uses: slackapi/slack-github-action@v1.24.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ VerityPass Production Tests Passed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "All Tests Passed"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "Branch: main\nReady for deployment\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow>"
                  }
                }
              ]
            }