name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        working-directory: ./api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: ./api
        env:
          SECRET_KEY: test-secret
          DISABLE_PASSWORD_LOGIN: 'true'
        run: pytest -q

  build-webapps:
    name: Build frontends
    runs-on: ubuntu-latest
    needs: backend-tests
    strategy:
      matrix:
        app: [webapp, webapp-admin]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & build
        working-directory: ./${{ matrix.app }}
        # For CI builds you may set repository secrets such as CI_VITE_API_BASE.
        # If not set the frontend build will rely on runtime `/api/frontend-config` when same-origin.
        env:
          VITE_API_BASE: ""
        run: |
          npm ci
          npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-dist
          path: ${{ matrix.app }}/dist
      - name: Upload sourcemaps to Sentry (optional)
        # This step will skip if SENTRY_AUTH_TOKEN is not set in the environment.
        # To enable: configure repository secrets SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT
        env:
          RELEASE: ${{ github.sha }}
        run: |
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "SENTRY_AUTH_TOKEN not set; skipping sourcemap upload"
            exit 0
          fi
          npm ci --no-audit --no-fund
          npx @sentry/cli releases new -p "$SENTRY_PROJECT" "$RELEASE"
          npx @sentry/cli releases files "$RELEASE" upload-sourcemaps ${{ matrix.app }}/dist --url-prefix "~/" --validate
          npx @sentry/cli releases finalize "$RELEASE"

