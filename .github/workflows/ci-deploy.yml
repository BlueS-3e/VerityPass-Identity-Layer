name: CI & Deploy

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network for manual deploy (sepolia or mainnet)'
        required: true
        default: 'sepolia'

jobs:
  test:
    name: Run tests (contracts + backend smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install contracts deps
        working-directory: ./contracts
        run: npm ci

      - name: Compile contracts
        working-directory: ./contracts
        run: npx hardhat compile

      - name: Run contract tests
        working-directory: ./contracts
        run: npx hardhat test

      - name: Setup Python for backend tests
        uses: actions/setup-python@v4
        with:
          python-version: 3.10

      - name: Install backend deps and run pytest (if present)
        working-directory: ./api
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt;
            if [ -d tests ]; then
              pytest -q || true;
            fi
          fi

  deploy:
    name: Manual Deploy (contracts)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install contracts deps
        working-directory: ./contracts
        run: npm ci

      - name: Prepare env for deploy
        run: |
          echo "DEPLOYER_PRIVATE_KEY=${{ secrets.DEPLOYER_PRIVATE_KEY }}" > contracts/.env
          echo "RPC_URL=${{ secrets.RPC_URL }}" >> contracts/.env
          echo "SEPOLIA_RPC_URL=${{ secrets.SEPOLIA_RPC_URL }}" >> contracts/.env
          echo "MAINNET_RPC_URL=${{ secrets.MAINNET_RPC_URL }}" >> contracts/.env
          echo "ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}" >> contracts/.env
          echo "BSCSCAN_API_KEY=${{ secrets.BSCSCAN_API_KEY }}" >> contracts/.env
        env:
          # safe-guard: secrets should be configured in GitHub repo settings
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}

      - name: Deploy contracts (Hardhat)
        working-directory: ./contracts
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          RPC_URL: ${{ secrets.RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          BSCSCAN_API_KEY: ${{ secrets.BSCSCAN_API_KEY }}
        run: |
          # Network selection comes from workflow_dispatch input
          NETWORK=${{ github.event.inputs.network }}
          echo "Deploying to network: $NETWORK"
          npx hardhat run --network $NETWORK contracts/scripts/deploy.js

      - name: Upload deployment artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: contracts-deployments
          path: contracts/deployments
