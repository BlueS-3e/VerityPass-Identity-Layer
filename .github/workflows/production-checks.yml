name: Production safety checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f api/requirements.txt ]; then pip install -r api/requirements.txt; fi
          pip install pytest
      - name: Run unit tests
        run: |
          pytest -q
      - name: Production startup-sanity (dry-run)
        env:
          FLASK_ENV: production
          ENV: production
        run: |
          python - <<'PY'
          import importlib
          import api.app as appmod
          importlib.reload(appmod)
          try:
              appmod.enforce_required_envs_or_exit()
              print('enforce_required_envs_or_exit() did not exit (unexpected)')
              raise SystemExit(1)
          except SystemExit:
              print('Startup enforcement exited as expected when required envs are missing')
          PY
