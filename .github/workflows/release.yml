name: Release (build webapp, publish artifact, push images)

on:
  push:
    # trigger on semver-like tags: v1.2.3
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and build webapp
        working-directory: ./webapp
        run: |
          npm ci
          npm run build

      - name: Run CSP check
        run: |
          python3 ./scripts/check_csp.py webapp/dist

      - name: Verify contract owner (blocking)
        env:
          RPC_URL: ${{ secrets.CHECK_OWNER_RPC_URL }}
          CONTRACT_ADDR: ${{ secrets.CHECK_OWNER_CONTRACT_ADDR }}
          EXPECTED_OWNER: ${{ secrets.CHECK_OWNER_EXPECTED_OWNER }}
        run: |
          echo "Verifying deployed contract owner() matches expected multisig..."
          node scripts/check-owner.js

      - name: Prepare webapp zip for release
        run: |
          cd webapp
          zip -r ../webapp-dist-${{ github.ref_name }}.zip dist

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: "Automated release: webapp dist + docker images"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release asset (zip)
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./webapp-dist-${{ github.ref_name }}.zip
          asset_name: webapp-dist-${{ github.ref_name }}.zip
          asset_content_type: application/zip

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/realmint-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/realmint-api:latest

      - name: Build and push Webapp image (nginx)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: webapp/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/realmint-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/realmint-web:latest
