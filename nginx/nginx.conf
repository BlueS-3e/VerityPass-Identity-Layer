user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Security headers
    server_tokens off;

    # Rate limiting zone for basic request limiting
    limit_req_zone $binary_remote_addr zone=one:10m rate=5r/s;

    server {
        listen 80;
        server_name _;

        # Serve static webapp
        root /usr/share/nginx/html;
        index index.html;

        # Gzip
        gzip on;

    # Security headers (production-ready defaults)
    # Content-Security-Policy: served via header in production. Adjust to use nonces/hashes for inline scripts/styles.
    # NOTE: CI will scan built HTML and fail if inline scripts/styles are present.
    # After confirming no inline content, we enforce a stricter CSP without 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https:; connect-src 'self' https: wss:; img-src 'self' data: https:; style-src 'self' https:" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Permissions-Policy "interest-cohort=()" always;

    # Basic rate limiting (protect admin endpoints)
    limit_req zone=one burst=10 nodelay;

        location /api/ {
            proxy_pass http://api:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
